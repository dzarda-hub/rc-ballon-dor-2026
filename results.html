<!doctype html>
<html lang="en" data-font="serif">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Results — RC Ballon d’Or 2026</title>
<style>
/* ============ BALLON D'OR IDENTITY TOKENS ============ */
:root{
  --ink:#08161f;
  --surface:#0c1f2b;
  --surface-2:#0a1a24;
  --champagne:#fcd4a0;
  --champagne-dim:color-mix(in srgb, var(--champagne) 74%, transparent);
  --champagne-faint:color-mix(in srgb, var(--champagne) 30%, transparent);
  --line:rgba(252,212,160,.78);
  --line-soft:rgba(252,212,160,.16);
  --orange:#e55838;
  --cream:#eef1f2;
  --text:#ffffff;
  --muted:color-mix(in srgb, var(--champagne) 62%, transparent);
  --radius:18px;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:'Bodoni Moda',Didot,Georgia,serif;
  --serif:'Bodoni Moda',Didot,Georgia,serif;
  --max:1200px;
}
html[data-font="sans"]{ --display:'Inter',system-ui,sans-serif; --serif:'Inter',system-ui,sans-serif; }
html[data-font="sans"] .banner-title{font-weight:700;text-transform:uppercase;letter-spacing:-.03em;font-size:clamp(2rem,4.4vw,3.6rem)}
html[data-font="sans"] .banner-tag{font-style:normal}

*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);
  font-size:16px;line-height:1.6;overflow-x:hidden;font-weight:300;
  background-image:
    radial-gradient(1100px 700px at 78% -12%, rgba(28,74,96,.55), transparent 62%),
    radial-gradient(900px 600px at 6% 4%, rgba(14,46,64,.5), transparent 60%);
  background-attachment:fixed;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;line-height:.95;margin:0;letter-spacing:-.035em;text-transform:uppercase}
.wrap{max-width:var(--max);margin:0 auto;padding:0 28px;position:relative;z-index:2}
.eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--champagne);font-weight:500;
  display:flex;align-items:center;justify-content:center;gap:12px}
.eyebrow::before{display:none}
.lead{color:var(--champagne-dim);font-size:.95rem;max-width:60ch;font-weight:400;line-height:1.7}
.note{color:var(--muted);font-size:.82rem}

/* ============ HEADER ============ */
.site-head{position:fixed;top:0;left:0;right:0;z-index:60}
.strip{background:var(--champagne);color:#0a1a24;height:36px;display:flex;align-items:center;overflow:hidden;
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.strip-inner{width:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding:0 24px;white-space:nowrap;overflow:hidden}
.strip-item{opacity:.85}
@media(max-width:900px){.strip-inner{gap:30px;font-size:8.5px}.strip-item:nth-child(n+5){display:none}}
@media(max-width:560px){.strip-item:nth-child(n+3){display:none}}

/* ============ NAV ============ */
.nav{background:#050d13;border-bottom:1px solid rgba(252,212,160,.12);
  transition:background .3s,border-color .3s,backdrop-filter .3s}
.nav.scrolled{background:rgba(5,13,19,.94);backdrop-filter:blur(18px) saturate(130%)}
.nav-inner{max-width:var(--max);margin:0 auto;padding:0 28px;height:66px;display:grid;
  grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.nav-left{display:flex;align-items:center;gap:22px}
.nav-left a{font-size:13.5px;color:var(--champagne);text-transform:capitalize;transition:.2s;font-weight:400}
.nav-left a:hover{color:#fff}
.nav-logo{display:flex;align-items:center;gap:10px;justify-self:center;color:var(--champagne)}
.nav-mark{width:18px;height:38px;flex:0 0 auto;display:block}
.nav-mark img{width:100%;height:100%;object-fit:contain;display:block}
.nav-word{font-size:17px;letter-spacing:.16em;text-transform:uppercase;font-weight:400;white-space:nowrap;color:#f6e7cf}
.nav-word{line-height:1.1}
.nav-word .tm{font-size:7px;letter-spacing:0;vertical-align:top;margin-left:2px;opacity:.75;display:inline-block;transform:translateY(1px)}
.nav-right{display:flex;align-items:center;gap:18px;justify-self:end}
.nav-lang{font-size:13px;color:var(--champagne);display:inline-flex;align-items:center;gap:5px}
.nav-edit{background:var(--champagne);color:#0a1a24;border:0;border-radius:999px;padding:8px 18px;
  font-size:12px;font-weight:600;cursor:pointer;transition:.2s}
.nav-edit:hover{background:#fff}
@media(max-width:820px){
  .nav-inner{display:flex;flex-wrap:wrap;height:auto;padding:0 16px;gap:0}
  .nav-logo{order:1;margin:0 auto;height:56px}
  .nav-right{order:2}
  .nav-left{order:3;flex:0 0 100%;justify-content:center;gap:26px;height:38px;
    border-top:1px solid rgba(252,212,160,.1)}
  .nav-left a{display:block;font-size:9px;letter-spacing:.18em;padding:0}
  .nav-left a::after{bottom:-4px}
  .nav-word{font-size:15px;letter-spacing:.12em}
  .nav-mark{width:16px;height:32px}
  .nav-lang{display:none}
  .hero{padding-top:152px}
}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:999px;padding:13px 26px;
  font-size:13px;font-weight:500;letter-spacing:.01em;cursor:pointer;
  border:1px solid transparent;transition:.22s;text-align:center;font-family:var(--sans)}
.btn-gold{background:var(--champagne);color:#0a1a24;border-color:var(--champagne)}
.btn-gold:hover{background:#fff;border-color:#fff;color:#0a1a24}
.btn-ghost{border-color:rgba(252,212,160,.6);color:var(--champagne);background:transparent}
.btn-ghost:hover{border-color:var(--champagne);background:rgba(252,212,160,.1)}
.btn-peach{background:var(--champagne);color:#0a1a24;border-color:var(--champagne);padding:15px 30px}
.btn-peach:hover{background:#fff;border-color:#fff}
.btn-line{border-color:rgba(252,212,160,.55);color:var(--champagne);background:transparent;padding:15px 30px}
.btn-line:hover{background:rgba(252,212,160,.12);border-color:var(--champagne)}
.btn-sm{padding:10px 18px;font-size:9.5px;letter-spacing:.16em}
.nav .btn{margin-left:14px}

/* ============ HERO ============ */
.hero{position:relative;padding:112px 0 24px;display:block;overflow:visible;min-height:0}
.hero::before{content:"";position:absolute;left:50%;top:-120px;width:min(1100px,90vw);height:600px;transform:translateX(-50%);
  background:radial-gradient(closest-side,rgba(28,74,96,.5),transparent 70%);pointer-events:none;z-index:0}
.banner{position:relative;display:grid;grid-template-columns:1fr 1.04fr;min-height:500px;
  border:1px solid rgba(252,212,160,.8);border-radius:20px;overflow:hidden;
  background:linear-gradient(115deg,#0d2a3a 0%,#0a1c27 55%,#081620 100%);
  box-shadow:0 40px 90px -40px rgba(0,0,0,.9)}
.banner-media{position:relative;overflow:hidden;background:#0a1a24;
  -webkit-mask-image:linear-gradient(90deg,#000 74%,rgba(0,0,0,.65) 88%,transparent 100%);
  mask-image:linear-gradient(90deg,#000 74%,rgba(0,0,0,.65) 88%,transparent 100%)}
.banner-media{background:#08161f}
.banner-media img{width:100%;height:100%;object-fit:cover;object-position:46% 42%;filter:brightness(.88) contrast(1.08) saturate(1.04)}
.banner-media::before{content:"";position:absolute;inset:0;z-index:1;mix-blend-mode:multiply;
  background:linear-gradient(155deg,rgba(9,30,42,.6) 0%,rgba(9,26,36,.28) 48%,rgba(12,35,48,.55) 100%)}
.banner-media::after{content:"";position:absolute;inset:0;z-index:2;
  background:
    linear-gradient(0deg,#0a1c27 0%,rgba(10,28,39,.35) 14%,transparent 34%),
    linear-gradient(180deg,rgba(8,22,31,.5) 0%,transparent 22%),
    linear-gradient(90deg,rgba(8,22,31,.45) 0%,rgba(8,22,31,.1) 30%,rgba(10,28,39,.6) 70%,#0a1c27 97%)}
.banner-body{padding:54px 52px 50px 12px;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:2}
.banner-lockup{display:flex;align-items:center;gap:12px;font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--champagne)}
.lockup-mark{width:20px;height:42px;flex:0 0 auto;display:block}
.lockup-mark img{width:100%;height:100%;object-fit:contain}
.banner-title{font-family:var(--serif);font-weight:500;font-size:clamp(2.7rem,5.4vw,4.5rem);line-height:.94;letter-spacing:-.005em;
  margin:20px 0 0;text-transform:none;
  background:linear-gradient(180deg,#fff8ee 0%,#fcd4a0 46%,#dda365 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.banner-title span{display:block}
.banner-title .bt-year{display:inline-block}
.banner-title em{font-style:italic;font-weight:500}
.bt-l2{display:flex;align-items:baseline;gap:.2em;flex-wrap:wrap}
.bt-year{font-size:.32em;letter-spacing:.14em;font-style:normal;font-family:var(--sans);font-weight:400;margin-left:.15em;
  -webkit-text-fill-color:#fcd4a0;color:#fcd4a0}
.banner-tag{font-family:var(--serif);font-style:italic;font-size:clamp(1.05rem,1.7vw,1.4rem);color:#f8ead4;margin:22px 0 10px;line-height:1.3;max-width:26ch}
.banner-intro{color:var(--champagne-dim);font-size:.9rem;line-height:1.7;margin:0 0 26px;max-width:46ch}
.banner-actions{display:flex;gap:10px;flex-wrap:wrap}
.banner .eyebrow{display:none}
.side-label,.hero-badge,.hero-grid,.hero-title,.hero-year,.hero-tag,.hero-intro,.hero-info,.hero-kicker,.hero-copy,.ball-stage,.ball,.ball-glow,.ball-ring{display:none!important}

/* countdown base */
.countdown{max-width:470px;margin-top:38px;border-top:1px solid rgba(252,212,160,.2)}
.cd{border-right:1px solid rgba(252,212,160,.14)}
.cd b{font-family:var(--serif);font-weight:400;color:var(--champagne)}
.cd span{color:var(--muted)}
.cd-label{color:var(--champagne-dim)}

.pill{display:inline-flex;align-items:center;gap:9px;font-size:11px;letter-spacing:.06em;
  color:var(--champagne);border:1px solid rgba(252,212,160,.4);padding:9px 16px;border-radius:999px;background:transparent}

/* ============ SECTIONS ============ */
section{position:relative;padding:104px 0;scroll-margin-top:88px}
.sec-head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:0;margin:0 auto 40px;max-width:780px}
.sec-head h2{font-family:var(--sans);font-size:clamp(1.75rem,3.4vw,2.45rem);margin:14px 0 14px;letter-spacing:.005em;
  color:#fff;font-weight:500;text-transform:uppercase;line-height:1.12}
.sec-head .lead{max-width:56ch;margin:0 auto}
.sec-num{display:none}
.hr{width:150px;height:1px;background:rgba(255,255,255,.45);margin:0 auto 34px}
.sec-head .hr{display:none}

/* filters */
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:30px}
.chip{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;padding:9px 16px;border-radius:999px;
  border:1px solid var(--line-soft);color:var(--champagne-dim);background:transparent;cursor:pointer;transition:.2s;font-weight:400}
.chip:hover{color:var(--champagne);border-color:var(--line)}
.chip.on{background:var(--champagne);border-color:var(--champagne);color:var(--ink);font-weight:600}

/* nominee cards */
.grid-nominees{display:grid;grid-template-columns:repeat(auto-fill,minmax(264px,1fr));gap:18px}
.nominee{position:relative;background:#0a1a24;border:1px solid rgba(252,212,160,.28);border-radius:14px;
  overflow:hidden;display:flex;flex-direction:column;transition:border-color .3s,transform .3s,background .3s}
.nominee:hover{border-color:rgba(252,212,160,.75);transform:translateY(-4px)}
.n-photo{position:relative;aspect-ratio:1/1;background:linear-gradient(165deg,#0e2432,#071520);overflow:hidden}
.n-photo img{width:100%;height:100%;object-fit:cover;object-position:top center;transition:transform .7s;filter:saturate(.92)}
.nominee:hover .n-photo img{transform:scale(1.04)}
.n-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,transparent 35%,rgba(11,11,10,.95) 100%)}
.initials{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:3.4rem;
  font-weight:300;color:color-mix(in srgb,var(--champagne) 58%, transparent);letter-spacing:.06em;z-index:0;
  background:
    radial-gradient(circle at 50% 44%, color-mix(in srgb,var(--champagne) 15%, transparent), transparent 58%),
    repeating-linear-gradient(115deg, color-mix(in srgb,var(--champagne) 4%, transparent) 0 1px, transparent 1px 11px);
  text-shadow:0 2px 30px rgba(0,0,0,.6)}
.initials::before{content:"";position:absolute;width:60%;aspect-ratio:1;border-radius:50%;
  border:1px solid color-mix(in srgb,var(--champagne) 20%, transparent);
  background:radial-gradient(circle, color-mix(in srgb,var(--champagne) 4%, transparent), transparent 70%)}
.n-rank{position:absolute;top:14px;left:16px;z-index:2;font-family:var(--display);font-size:26px;font-weight:300;
  color:var(--champagne);letter-spacing:-.02em;line-height:1;text-shadow:0 2px 14px rgba(0,0,0,.7)}
.n-tag{position:absolute;top:16px;right:16px;z-index:2;font-size:8px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--champagne);background:rgba(0,0,0,.55);border:1px solid var(--line);padding:5px 9px;border-radius:999px;
  backdrop-filter:blur(8px);font-weight:400}
.n-body{padding:16px 18px 20px;display:flex;flex-direction:column;gap:9px;flex:1;position:relative;z-index:2}
.n-body h3{font-family:var(--sans);font-size:1.02rem;font-weight:700;letter-spacing:0;line-height:1.25;color:#fff;text-transform:none}
.n-meta{font-size:11px;color:var(--champagne-dim);letter-spacing:.02em;text-transform:none;margin:0;font-weight:400}
.n-quote{font-family:var(--serif);font-style:italic;font-size:.98rem;color:rgba(213,202,173,.78);
  line-height:1.3;border:0;padding:0;margin:2px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.n-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:0;margin-top:auto;padding-top:14px;border-top:1px solid var(--line-soft)}
.n-stats div{text-align:left;border-right:1px solid var(--line-soft);padding-left:2px}
.n-stats div:last-child{border-right:0}
.n-stats b{display:block;font-family:var(--display);font-size:1.15rem;font-weight:500;color:var(--champagne);line-height:1.1}
.n-stats span{font-size:7.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.n-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px}
.pts{font-family:var(--display);font-size:1.05rem;font-weight:500;color:var(--orange);letter-spacing:.02em}
.pts small{font-family:var(--sans);font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-left:4px}
.link-btn{background:none;border:0;cursor:pointer;font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--champagne);border-bottom:1px solid var(--line);padding:2px 0;transition:.2s;font-family:var(--sans);font-weight:400}
.link-btn:hover{color:var(--orange);border-color:var(--orange)}

/* ============ LIGHT BAND ============ */
.band{background:var(--cream);color:#0c0c0b;margin:0}
.band .eyebrow{color:#b4442a}
.band .eyebrow::before{background:#b4442a}
.band .sec-head h2{color:#0c0c0b}
.band .sec-num{-webkit-text-stroke:1px rgba(12,12,11,.28)}
.band .lead{color:rgba(12,12,11,.62)}
.band .hr{background:rgba(12,12,11,.14)}
.band .board{border-color:rgba(12,12,11,.16);background:transparent}
.band .board-head{color:rgba(12,12,11,.52);border-bottom-color:rgba(12,12,11,.16)}
.band .brow{border-bottom-color:rgba(12,12,11,.1)}
.band .brow:hover{background:rgba(12,12,11,.035)}
.band .brow .pos{color:rgba(12,12,11,.38)}
.band .brow.top .pos{color:#0c0c0b}
.band .bname b{color:#0c0c0b}
.band .bname span{color:rgba(12,12,11,.5)}
.band .bpts{color:#0c0c0b}
.band .bfirst{color:rgba(12,12,11,.55)}
.band .bar{background:#b4442a;height:2px}
.band .bnote{color:rgba(12,12,11,.55)}
.band .link-btn{color:#0c0c0b;border-color:rgba(12,12,11,.3)}

/* leaderboard */
.board{border-top:1px solid var(--line);border-bottom:1px solid var(--line-soft)}
.board-head,.brow{display:grid;grid-template-columns:60px 1fr 104px 92px;gap:16px;align-items:center;padding:16px 4px}
.board-head{font-size:8.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);
  border-bottom:1px solid var(--line-soft);font-weight:400}
.board-head span:nth-child(3),.board-head span:nth-child(4){text-align:right}
.brow{border-bottom:1px solid var(--line-soft);position:relative;transition:background .2s}
.brow:last-child{border-bottom:0}
.brow:hover{background:rgba(213,202,173,.04)}
.brow .pos{font-family:var(--display);font-size:1.5rem;color:rgba(213,202,173,.4);font-weight:300;letter-spacing:-.02em}
.brow.top .pos{color:var(--champagne)}
.bname{display:flex;flex-direction:column;min-width:0}
.bname b{font-family:var(--display);font-size:1.02rem;font-weight:500;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.bname span{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.bar{position:absolute;left:0;bottom:-1px;height:1px;background:var(--orange);width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.bpts{text-align:right;font-family:var(--display);font-size:1.15rem;font-weight:500;color:var(--champagne);font-variant-numeric:tabular-nums}
.bfirst{text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:300}
.bnote{font-size:11px;color:var(--muted);margin-top:16px;display:flex;gap:8px;align-items:center;line-height:1.5}
.bnote svg{flex:0 0 auto}

/* winner */
.winner-card{position:relative;display:grid;grid-template-columns:.88fr 1.12fr;border:1px solid var(--line);
  border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.w-photo{position:relative;min-height:460px;background:linear-gradient(160deg,#0e2432,#071520);overflow:hidden}
.w-photo img{width:100%;height:100%;object-fit:cover;object-position:top center;filter:saturate(.95)}
.w-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 50%,rgba(11,11,10,.95))}
.w-info{padding:48px;position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center}
.w-crown{display:inline-flex;align-items:center;gap:10px;font-size:8.5px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--orange);margin-bottom:20px;font-weight:500}
.w-info h3{font-size:clamp(2.2rem,4.8vw,3.8rem);line-height:.88;margin-bottom:12px;color:var(--champagne);letter-spacing:-.045em}
.w-role{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-bottom:24px}
.w-quote{font-family:var(--serif);font-style:italic;font-size:1.35rem;line-height:1.3;color:color-mix(in srgb, var(--text) 88%, transparent);
  border-left:1px solid var(--orange);padding-left:18px;margin:0 0 22px;text-transform:none;letter-spacing:0}
.w-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-bottom:24px;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.w-stats div{padding:14px 12px 14px 0;border-right:1px solid var(--line-soft)}
.w-stats div:last-child{border-right:0}
.w-stats b{display:block;font-family:var(--display);font-size:1.7rem;font-weight:400;color:var(--champagne);line-height:1}
.w-stats span{font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.locked{position:relative;text-align:center;padding:80px 30px;border:1px solid var(--line);border-radius:var(--radius);
  background:radial-gradient(circle at 50% 0%,rgba(213,202,173,.09),transparent 68%)}
.locked h3{font-size:clamp(1.8rem,4vw,3rem);margin:18px 0 12px;color:var(--champagne);letter-spacing:-.04em}
.locked .eyebrow{justify-content:center}
.lock-ico{width:34px;height:34px;margin:0 auto;opacity:.9}

/* trophy band */
.trophy-band{padding:0;overflow:hidden;position:relative;min-height:640px;display:flex;align-items:center;
  border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);background:#000}
.trophy-band .wrap{width:100%}
.trophy-bg{position:absolute;top:0;right:0;bottom:0;width:64%;z-index:0}
.trophy-bg img{width:100%;height:100%;object-fit:cover;object-position:54% 44%;opacity:.95}
.trophy-bg::after{content:"";position:absolute;inset:0;background:
  linear-gradient(90deg,#000 24%,rgba(0,0,0,.92) 36%,rgba(0,0,0,.45) 50%,rgba(0,0,0,.05) 66%,transparent 80%),
  linear-gradient(0deg,#000 0%,rgba(0,0,0,.5) 12%,transparent 32%),
  linear-gradient(180deg,rgba(0,0,0,.75) 0%,transparent 20%)}
.trophy-copy{position:relative;z-index:2;max-width:min(620px,52%);padding:96px 30px 96px 0}
.trophy-copy h2{font-size:clamp(2.2rem,5vw,3.9rem);color:var(--champagne);margin:16px 0 16px;letter-spacing:-.045em;line-height:.92}
.trophy-bg img{filter:brightness(1.02) contrast(1.03) saturate(1)}
.band-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:28px;margin-top:20px}
.band-foot .bnote{margin-top:0;max-width:56ch}
.band-trophy img{width:132px;height:auto;display:block;opacity:.95}
.hero-logo{width:100%;height:auto;display:block;filter:drop-shadow(0 24px 50px rgba(0,0,0,.75))}

/* categories */
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:16px}
#catGrid{grid-template-columns:repeat(3,1fr)}
.cat{position:relative;padding:30px 26px;border-radius:14px;border:1px solid rgba(252,212,160,.26);
  background:#0a1a24;transition:.28s;overflow:hidden}
.cat:hover{border-color:rgba(252,212,160,.6);background:#0c1f2b;transform:translateY(-3px)}
.cat-mark{font-family:var(--display);font-size:11px;letter-spacing:.24em;color:var(--orange);
  margin-bottom:26px;font-weight:500}
.cat h4{font-size:1.12rem;margin-bottom:10px;letter-spacing:.005em;font-weight:600;color:var(--text)}
.cat p{font-size:.88rem;color:var(--champagne-dim);margin:0;font-weight:300;line-height:1.55}
.cat-win{display:block;margin-top:18px;padding-top:14px;border-top:1px solid var(--line-soft);
  font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}


/* sponsors */
.sponsors{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0;border-top:1px solid var(--line)}
.sponsor{padding:26px 26px 26px 0;border-right:1px solid var(--line-soft);display:flex;flex-direction:column;gap:7px}
.sponsor:last-child{border-right:0}
.sponsor .tier{font-size:8px;letter-spacing:.26em;text-transform:uppercase;color:var(--orange)}
.sponsor b{font-family:var(--display);font-size:1.02rem;font-weight:500;letter-spacing:.01em;color:var(--champagne)}
.sponsor p{margin:0;font-size:.82rem;color:var(--muted);font-weight:300}

/* vote */
.vote-box{display:grid;grid-template-columns:.82fr 1.18fr;gap:40px;border:1px solid var(--line);
  border-radius:var(--radius);padding:44px;background:
    radial-gradient(600px 300px at 8% 0%,rgba(213,202,173,.08),transparent 70%),var(--surface)}
.vote-left h3{font-size:clamp(1.55rem,2.7vw,2.05rem);margin:14px 0 12px;color:var(--champagne);letter-spacing:-.015em;line-height:1.02;text-transform:none;overflow-wrap:break-word}
.vote-left p{color:var(--champagne-dim);font-size:.9rem;font-weight:300}
.vote-total{margin-top:26px;font-size:8.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}
.vote-total b{display:block;font-family:var(--display);font-size:3.2rem;color:var(--champagne);letter-spacing:-.03em;
  text-transform:none;font-weight:300;line-height:1;margin-bottom:6px}
.vlist{display:flex;flex-direction:column}
.vrow{position:relative;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;
  padding:12px 2px;border-bottom:1px solid var(--line-soft);overflow:hidden}
.vrow:last-child{border-bottom:0}
.vrow .vbar{position:absolute;left:0;bottom:0;height:1px;background:var(--orange);width:0;transition:width 1s}
.vrow .vname{position:relative;z-index:1;font-size:.88rem;display:flex;gap:10px;align-items:baseline;color:var(--text);font-weight:300}
.vrow .vname i{font-style:normal;font-size:8px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase}
.vrow .vcount{position:relative;z-index:1;display:flex;align-items:center;gap:12px}
.vrow .vcount b{font-family:var(--display);font-size:1rem;color:var(--champagne);font-variant-numeric:tabular-nums;font-weight:400}
.vbtn{position:relative;z-index:1;border:1px solid var(--line);background:transparent;color:var(--champagne);
  border-radius:999px;padding:6px 13px;font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;transition:.2s;font-family:var(--sans)}
.vbtn:hover:not(:disabled){background:var(--champagne);color:var(--ink);border-color:var(--champagne)}
.vbtn:disabled{opacity:.3;cursor:not-allowed}
.vote-closes{margin-top:24px;border-top:1px solid var(--line-soft);padding-top:16px;max-width:30ch;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);line-height:1.9}
.voted-note{margin-top:16px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);display:flex;gap:8px;align-items:center}

/* footer */
footer{border-top:1px solid var(--line-soft);padding:60px 0 36px;position:relative;z-index:2}
.foot{display:grid;grid-template-columns:1.6fr 1fr;gap:36px;margin-bottom:44px}
.foot-logo{width:74px;height:auto;margin-bottom:16px;opacity:.95}
.foot h4{font-family:var(--display);font-size:1.1rem;font-weight:600;letter-spacing:.1em;margin-bottom:12px;color:var(--champagne);text-transform:uppercase}
.foot p{font-size:.84rem;color:var(--muted);margin:0 0 8px;font-weight:300;line-height:1.7}
.foot a.f-link{font-size:.84rem;color:var(--muted);display:block;padding:4px 0;transition:.2s;font-weight:300}
.foot a.f-link:hover{color:var(--orange)}
.motto{font-family:var(--serif);font-style:italic;color:var(--champagne);font-size:1.1rem;text-transform:none;letter-spacing:0}
.foot-bottom{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:10px;color:var(--muted);
  border-top:1px solid var(--line-soft);padding-top:22px;letter-spacing:.1em;text-transform:uppercase;font-weight:300}
.foot-bottom button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:10px;padding:0;transition:.2s;
  letter-spacing:.1em;text-transform:uppercase;font-family:var(--sans)}
.foot-bottom button:hover{color:var(--orange)}
/* results */
.results-card{border:1px solid rgba(252,212,160,.35);border-radius:18px;background:#0a1a24;padding:34px}
.results-list{list-style:none;margin:0;padding:0}
.results-list li{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--line-soft)}
.results-list li:last-child{border-bottom:0}
.r-place{font-family:var(--serif);font-size:1.6rem;color:var(--champagne)}
.r-name{font-weight:600;color:#fff}
.r-detail{font-size:12px;color:var(--muted);letter-spacing:.06em}
.lock-rows{display:grid;margin-top:34px;max-width:660px;margin-left:auto;margin-right:auto;text-align:left}
.lock-row{display:grid;grid-template-columns:44px 1fr 140px;gap:16px;align-items:center;padding:15px 0;border-bottom:1px solid rgba(252,212,160,.14)}
.lock-row:last-child{border-bottom:0}
.lr-pos{font-family:var(--serif);font-size:1rem;color:var(--muted)}
.lr-bar{height:7px;border-radius:4px;background:linear-gradient(90deg,rgba(252,212,160,.22),rgba(252,212,160,.05))}
.lr-tag{font-size:8px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);text-align:right}

/* news */
.news-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}
.news-card{border:1px solid rgba(252,212,160,.25);border-radius:14px;background:#0a1a24;padding:26px 26px 24px;
  display:flex;flex-direction:column;gap:12px;transition:.25s}
.news-card:hover{border-color:rgba(252,212,160,.6);transform:translateY(-3px)}
.news-tag{font-size:8.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--orange)}
.news-card h3{font-family:var(--sans);font-size:1.12rem;font-weight:600;text-transform:none;color:#fff;line-height:1.3;letter-spacing:0}
.news-card p{font-size:.87rem;color:var(--champagne-dim);margin:0;line-height:1.65}

.ed-label{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.ev-val{font-size:.95rem;color:#fff}
.nom-label{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}

/* ============ PUBLISH ============ */
.pub-root{position:fixed;inset:0;z-index:110;display:none;align-items:center;justify-content:center;padding:20px}
.pub-root.open{display:flex}
.pub-bg{position:absolute;inset:0;background:rgba(3,9,13,.86);backdrop-filter:blur(10px)}
.pub-card{position:relative;z-index:1;width:min(620px,100%);max-height:88vh;overflow:auto;padding:38px 36px 30px;
  border-radius:20px;border:1px solid rgba(252,212,160,.35);
  background:radial-gradient(120% 90% at 50% 0%,rgba(252,212,160,.1),transparent 60%),linear-gradient(180deg,#0b1f2b,#081520);
  box-shadow:0 60px 100px -40px #000}
.pub-card h3{font-family:var(--display);font-size:clamp(1.7rem,3.4vw,2.3rem);margin:12px 0 10px;
  background:linear-gradient(180deg,#fff6e8,#fcd4a0 75%);-webkit-background-clip:text;background-clip:text;color:transparent}
.pub-card>p{font-size:.92rem;color:rgba(252,212,160,.7);line-height:1.65;margin:0 0 20px}
.pub-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.pub-actions .btn{padding:13px 24px;font-size:10.5px}
.pub-note{font-size:11.5px;color:rgba(252,212,160,.5);line-height:1.6;margin:0 0 16px}
.pub-note code{color:#fcd4a0}
.pub-raw{border-top:1px solid rgba(252,212,160,.14);padding-top:14px;margin-top:6px}
.pub-raw summary{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(252,212,160,.6);cursor:pointer}
.pub-raw textarea{width:100%;height:150px;margin-top:12px;background:#06121a;color:#cfe3ec;border:1px solid rgba(252,212,160,.2);
  border-radius:8px;padding:10px;font:11px/1.5 ui-monospace,Menlo,monospace;resize:vertical}
.pub-size{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(252,212,160,.35);margin:14px 0 0}

/* ============ MODAL ============ */
.modal-root{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:20px}
.modal-root.open{display:flex}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.86);backdrop-filter:blur(10px);animation:fade .25s}
.modal{position:relative;z-index:1;width:min(940px,100%);max-height:88vh;overflow:auto;border-radius:var(--radius);
  border:1px solid var(--line);background:var(--surface);box-shadow:0 50px 90px -30px #000;animation:pop .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(16px)}}
.m-grid{display:grid;grid-template-columns:.82fr 1.18fr}
.m-photo{position:relative;min-height:400px;background:linear-gradient(160deg,#0e2432,#071520)}
.m-photo img{width:100%;height:100%;object-fit:cover;object-position:top center}
.m-photo .initials{font-size:4.6rem}
.m-body{padding:40px 38px;position:relative}
.m-close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
  background:rgba(0,0,0,.5);cursor:pointer;display:grid;place-items:center;color:var(--champagne);z-index:3;transition:.2s;font-size:16px}
.m-close:hover{background:var(--champagne);color:var(--ink);border-color:var(--champagne)}
.m-body h3{font-size:2.1rem;margin:8px 0 10px;color:var(--champagne);letter-spacing:-.04em}
.m-sub{font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-bottom:22px}
.m-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:0;margin:22px 0;border-top:1px solid var(--line-soft)}
.m-stat{padding:13px 14px 13px 0;display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1px solid var(--line-soft);border-right:1px solid var(--line-soft)}
.m-stat:nth-child(2n){border-right:0;padding-left:14px}
.m-stat span{font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.m-stat b{font-family:var(--display);font-size:1.15rem;color:var(--champagne);font-weight:400}
.m-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.m-tag{font-size:8px;letter-spacing:.18em;text-transform:uppercase;border:1px solid var(--line);
  color:var(--champagne-dim);padding:5px 10px;border-radius:999px;font-weight:400}

/* ============ EDITOR ============ */
.fab{position:fixed;right:22px;bottom:22px;z-index:70;display:inline-flex;align-items:center;gap:9px;
  padding:13px 20px;border-radius:999px;border:1px solid var(--line);
  background:rgba(0,0,0,.9);backdrop-filter:blur(14px);color:var(--champagne);cursor:pointer;
  font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;box-shadow:0 16px 34px -14px #000;transition:.25s}
.fab:hover{background:var(--champagne);color:var(--ink);border-color:var(--champagne);transform:translateY(-2px)}
.fab svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7}
body.panel-open .fab{opacity:0;pointer-events:none;transform:scale(.9)}

.editor-panel{position:fixed;top:0;right:0;height:100dvh;width:min(446px,100vw);z-index:85;
  background:#050505;border-left:1px solid var(--line);transform:translateX(101%);
  transition:transform .38s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;
  box-shadow:-30px 0 70px -30px #000}
.editor-panel.open{transform:none}
.ep-head{padding:16px 18px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:10px;flex:0 0 auto}
.ep-head b{font-family:var(--display);font-size:11px;letter-spacing:.24em;text-transform:uppercase;font-weight:500;color:var(--champagne)}
.ep-head .dot{width:6px;height:6px;border-radius:50%;background:var(--orange);box-shadow:0 0 8px var(--orange)}
.ep-head .save{font-size:8.5px;color:var(--muted);letter-spacing:.18em;margin-left:auto;text-transform:uppercase}
.ep-close{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--champagne);
  cursor:pointer;font-size:16px;line-height:1;display:grid;place-items:center}
.ep-close:hover{background:var(--champagne);color:var(--ink);border-color:var(--champagne)}
.ep-tabs{display:flex;flex-wrap:wrap;gap:2px;padding:9px 10px;border-bottom:1px solid var(--line-soft);flex:0 0 auto}
.ep-tabs::-webkit-scrollbar{display:none}
.ep-tab{flex:0 0 auto;padding:7px 11px;border-radius:999px;border:0;background:none;color:var(--muted);
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:.18s;font-family:var(--sans)}
.ep-tab:hover{color:var(--champagne);background:rgba(213,202,173,.07)}
.ep-tab.on{background:var(--champagne);color:var(--ink);font-weight:600}
.ep-body{overflow-y:auto;padding:16px 16px 60px;flex:1;overscroll-behavior:contain;min-height:0}
.ep-hint{font-size:11px;line-height:1.6;color:var(--champagne-dim);background:rgba(213,202,173,.05);
  border-left:2px solid var(--orange);padding:10px 12px;margin-bottom:18px;font-weight:300}
.ef{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.ef>span{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.ef input[type=text],.ef input[type=url],.ef input[type=number],.ef input[type=datetime-local],.ef input[type=date],
.ef select,.ef textarea{width:100%;background:#0e0e0d;border:1px solid var(--line-soft);border-radius:6px;
  color:var(--text);padding:9px 10px;font-size:12.5px;font-family:var(--sans);font-weight:300;transition:.18s}
.ef input:focus,.ef select:focus,.ef textarea:focus{outline:0;border-color:var(--champagne);background:#131312}
.ef textarea{resize:vertical;min-height:64px;line-height:1.5}
.ef-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ef-check{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--text);margin-bottom:14px;cursor:pointer;font-weight:300}
.ef-check input{width:15px;height:15px;accent-color:var(--orange)}
details.ed-item{border:1px solid var(--line-soft);border-radius:8px;margin-bottom:8px;overflow:hidden;background:#0b0b0a}
details.ed-item>summary{padding:11px 12px;cursor:pointer;font-size:11.5px;display:flex;align-items:center;gap:8px;list-style:none;font-weight:300}
details.ed-item>summary::-webkit-details-marker{display:none}
details.ed-item>summary::before{content:"+";color:var(--orange);font-size:13px;width:10px}
details.ed-item[open]>summary::before{content:"–"}
details.ed-item[open]>summary{border-bottom:1px solid var(--line-soft);color:var(--champagne)}
.ed-inner{padding:12px}
.ed-actions{display:flex;gap:4px;margin-left:auto}
.mini{width:24px;height:24px;border-radius:6px;border:1px solid var(--line-soft);background:none;color:var(--muted);
  cursor:pointer;font-size:11px;display:grid;place-items:center;transition:.18s;flex:0 0 auto}
.mini:hover{background:var(--champagne);color:var(--ink);border-color:var(--champagne)}
.mini.danger:hover{background:var(--orange);border-color:var(--orange);color:#fff}
.add-btn{width:100%;padding:11px;border-radius:6px;border:1px dashed var(--line);background:transparent;
  color:var(--champagne);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;margin-top:4px;transition:.2s;font-family:var(--sans)}
.add-btn:hover{background:rgba(213,202,173,.08);border-color:var(--champagne)}
.ed-photo{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.ed-photo .thumb{width:54px;height:54px;border-radius:6px;object-fit:cover;background:#151514;border:1px solid var(--line-soft);flex:0 0 auto}
.ed-photo .up{flex:1;font-size:9.5px;color:var(--muted)}
.ed-photo input[type=file]{font-size:9.5px;color:var(--muted);max-width:100%}
.ed-stat{display:grid;grid-template-columns:1fr 76px 24px;gap:6px;margin-bottom:6px}
.ed-stat input{background:#0e0e0d;border:1px solid var(--line-soft);border-radius:5px;color:var(--text);padding:6px 8px;font-size:11.5px;width:100%;font-family:var(--sans)}
.ed-stat input:focus{outline:0;border-color:var(--champagne)}
.ed-sep{height:1px;background:var(--line-soft);margin:18px 0}
.ed-h{font-size:8.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--orange);margin:18px 0 12px;font-weight:500}
.colors{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.colors label{display:flex;flex-direction:column;gap:5px;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.colors input[type=color]{width:100%;height:38px;border:1px solid var(--line-soft);border-radius:6px;background:#0e0e0d;padding:3px;cursor:pointer}
.btn-row{display:grid;gap:8px;margin-top:10px}
.ed-btn{padding:12px;border-radius:6px;border:1px solid var(--line-soft);background:transparent;
  color:var(--text);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;transition:.2s;text-align:center;font-family:var(--sans)}
.ed-btn:hover{background:rgba(213,202,173,.07);border-color:var(--champagne)}
.ed-btn.gold{background:var(--champagne);color:var(--ink);border-color:var(--champagne);font-weight:600}
.ed-btn.gold:hover{background:var(--orange);border-color:var(--orange);color:#fff}
.ed-btn.red{color:#e58f7b;border-color:rgba(229,88,56,.3)}
.ed-btn.red:hover{background:rgba(229,88,56,.12)}

/* toast */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);z-index:120;background:#0e0e0d;
  border:1px solid var(--line);color:var(--champagne);padding:12px 22px;border-radius:999px;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;opacity:0;pointer-events:none;transition:.3s;
  box-shadow:0 14px 30px -12px #000;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
body.editing [data-editable]{outline:1px dashed var(--line);outline-offset:4px}

/* ============ RESPONSIVE ============ */
@media(max-width:980px){
  .hero{padding:92px 0 56px}
  .banner{grid-template-columns:1fr;min-height:0}
  .banner-media{height:270px}
  .banner-media::after{background:linear-gradient(180deg,rgba(8,22,31,.2) 0%,rgba(10,28,39,.75) 60%,#0a1c27 98%)}
  .banner-media::before{background:linear-gradient(160deg,rgba(9,30,42,.55),rgba(9,26,36,.25))}
  .banner-body{padding:20px 22px 28px}
  .banner-title{font-size:clamp(2.5rem,11vw,3.2rem)}
  .banner-actions .btn{flex:1 1 100%}
  .nav-word{letter-spacing:.08em}
  .nav-links a:not(.btn){display:none}
  .brand-txt b{font-size:13px}
  .sec-head{grid-template-columns:1fr}
  .sec-num{display:none}
  .winner-card{grid-template-columns:1fr}
  .trophy-band{display:block;min-height:0}
  .trophy-bg{position:relative;width:100%;height:360px}
  .trophy-bg img{object-position:50% 40%}
  .trophy-bg::after{background:
    linear-gradient(0deg,#000 0%,rgba(0,0,0,.9) 14%,rgba(0,0,0,.45) 36%,transparent 62%),
    linear-gradient(180deg,rgba(0,0,0,.5) 0%,transparent 26%)}
  .trophy-copy{padding:26px 0 56px;max-width:none;max-width:100%}
  .band-trophy{display:none}
  .w-photo{min-height:360px}
  .w-info{padding:30px}

  .m-photo{min-height:260px;max-height:300px}

  .foot{grid-template-columns:1fr;gap:26px}
  section{padding:66px 0}

  .board-head span:nth-child(3){display:none}
  .brow .bfirst{display:none}

  .sponsor{border-right:0;border-bottom:1px solid var(--line-soft);padding:20px 0}

}
@media(max-width:560px){
  .wrap{padding:0 20px}
  .nav-inner{padding:10px 20px;gap:12px}
  .nav .btn{padding:9px 13px;font-size:8.5px}
  .brand-txt span{font-size:7px;letter-spacing:.18em}

  .cd span{font-size:7px}

    .tl::before{display:none}

}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  .nav,.fab,.editor-panel,.editor-bar{display:none!important}
  body{background:#fff;color:#000}
  .reveal{opacity:1!important;transform:none!important}
}
/* =========================================================
   ELITE LAYER — visual upgrade (no content changes)
   ========================================================= */
:root{
  --gold-grad: linear-gradient(135deg,#fbeedb 0%,#fcd4a0 34%,#e0ad72 62%,#f8dfb6 100%);
  --panel: linear-gradient(165deg,#0c2130 0%,#0a1a24 55%,#081520 100%);
  --hair: rgba(252,212,160,.24);
  --ease: cubic-bezier(.2,.8,.2,1);
}

/* ---- texture + progress ---- */
body::after{
  content:"";position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
  mix-blend-mode:overlay;
}
::selection{background:rgba(252,212,160,.28);color:#fff}
.progress{position:fixed;top:0;left:0;height:2px;width:0;z-index:120;
  background:linear-gradient(90deg,#e0ad72,#fcd4a0 60%,#fff3df);
  box-shadow:0 0 14px rgba(252,212,160,.55);transition:width .1s linear}

/* ---- nav ---- */
.site-head{background:linear-gradient(180deg,rgba(5,13,19,.96),rgba(5,13,19,.72))}
.nav{background:transparent;border-bottom:1px solid rgba(252,212,160,.1);backdrop-filter:blur(18px) saturate(120%)}
.nav.scrolled{background:rgba(5,13,19,.88);border-bottom-color:rgba(252,212,160,.18)}
.nav-inner{height:74px}
.nav-left a{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:rgba(252,212,160,.72);position:relative;padding:6px 0}
.nav-left a::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:var(--gold-grad);
  transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease)}
.nav-left a:hover{color:#fcd4a0}
.nav-left a:hover::after{transform:scaleX(1)}
.nav-logo{gap:12px}
.nav-mark{width:20px;height:42px;filter:drop-shadow(0 0 12px rgba(252,212,160,.25))}
.nav-word{font-size:18px;letter-spacing:.2em;color:#f8e6cd}
.nav-edit{background:var(--gold-grad);color:#0a1a24;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  font-size:10px;padding:11px 22px;box-shadow:0 8px 24px -10px rgba(252,212,160,.7);transition:.25s var(--ease)}
.nav-edit:hover{transform:translateY(-1px);box-shadow:0 12px 30px -10px rgba(252,212,160,.9)}

/* ---- hero ---- */
.hero{padding:132px 0 40px}
.hero::before{top:-180px;height:760px;width:min(1280px,100vw);
  background:radial-gradient(closest-side,rgba(30,80,104,.55),rgba(12,40,56,.25) 55%,transparent 72%)}
.banner{min-height:560px;border:1px solid rgba(252,212,160,.5);border-radius:22px;
  box-shadow:0 1px 0 rgba(255,255,255,.07) inset,0 80px 140px -70px #000,0 0 0 1px rgba(0,0,0,.5);
  background:linear-gradient(112deg,#0d2b3b 0%,#0a1d29 40%,#0a1d29 66%,#07131c 100%)}
.banner::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:22px;
  background:linear-gradient(115deg,transparent 26%,rgba(255,255,255,.08) 44%,transparent 58%);
  transform:translateX(-120%);animation:sweep 11s ease-in-out 3s infinite}
@keyframes sweep{0%,72%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.banner-media img{filter:brightness(.92) contrast(1.1) saturate(1.02)}
.banner-media::before{background:linear-gradient(150deg,rgba(8,26,37,.72) 0%,rgba(8,22,31,.32) 46%,rgba(22,58,76,.6) 100%)}
.banner-media::after{background:
  radial-gradient(80% 70% at 42% 42%,transparent 40%,rgba(6,18,26,.55) 100%),
  linear-gradient(0deg,#0a1d29 0%,rgba(10,29,41,.35) 16%,transparent 38%),
  linear-gradient(90deg,rgba(8,22,31,.35) 0%,transparent 24%,rgba(10,29,41,.5) 58%,rgba(10,29,41,.85) 100%)}
.banner-body{padding:58px 56px 54px 14px}
.banner-lockup{font-size:10px;letter-spacing:.34em}
.banner-title{font-size:clamp(2.9rem,5.7vw,5rem);line-height:.9;letter-spacing:-.012em;
  background:linear-gradient(100deg,#fff8ee 0%,#fcd4a0 38%,#e6b57c 62%,#fff3e0 100%);
  background-size:180% 100%;-webkit-background-clip:text;background-clip:text;
  animation:goldShift 12s ease-in-out infinite}
@keyframes goldShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.banner-tag{font-size:clamp(1.15rem,1.8vw,1.5rem);color:#f9ead3;margin:26px 0 12px}
.banner-intro{font-size:.95rem;line-height:1.75;color:rgba(252,212,160,.7)}
.banner-actions{margin-top:34px;gap:12px}
.btn{padding:15px 32px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.btn-peach{background:var(--gold-grad);border-color:transparent;color:#0a1a24;
  box-shadow:0 18px 40px -18px rgba(252,212,160,.85);position:relative;overflow:hidden}
.btn-peach:hover{transform:translateY(-2px);box-shadow:0 24px 50px -18px rgba(252,212,160,1);background:var(--gold-grad)}
.btn-line{border-color:rgba(252,212,160,.4);color:#f8e6cd;backdrop-filter:blur(6px)}
.btn-line:hover{background:rgba(252,212,160,.1);border-color:rgba(252,212,160,.8)}

/* ---- section heads ---- */
section{padding:104px 0}
.sec-head{margin-bottom:48px}
.eyebrow{font-size:9.5px;letter-spacing:.36em;gap:14px}
.eyebrow::before,.eyebrow::after{content:"";width:26px;height:1px;background:linear-gradient(90deg,transparent,rgba(252,212,160,.7));display:block}
.eyebrow::before{background:linear-gradient(90deg,rgba(252,212,160,.7),transparent)}
.sec-head h2{font-size:clamp(1.9rem,3.6vw,2.8rem);letter-spacing:.02em;margin:16px 0 16px;
  background:linear-gradient(180deg,#ffffff 20%,#f6e6cf 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sec-head .lead{font-size:.98rem;max-width:54ch}
.hr{width:52px;height:1px;background:linear-gradient(90deg,transparent,rgba(252,212,160,.75),transparent);margin:0 auto 44px}

/* ---- awards ---- */
#catGrid{gap:18px}
.cat{display:flex;flex-direction:column;min-height:214px;padding:32px 28px 26px;border-radius:16px;border:1px solid rgba(252,212,160,.18);
  background:linear-gradient(165deg,rgba(255,255,255,.045),rgba(255,255,255,.012) 40%,rgba(0,0,0,.2));
  position:relative;overflow:hidden;transition:.4s var(--ease)}
.cat::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(252,212,160,.55),transparent);opacity:0;transition:.4s}
.cat::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:0;
  background:var(--gold-grad);transition:width .5s var(--ease)}
.cat:hover{transform:translateY(-6px);border-color:rgba(252,212,160,.5);
  box-shadow:0 30px 60px -40px rgba(0,0,0,.9),0 0 60px -30px rgba(252,212,160,.35)}
.cat:hover::before{opacity:1}
.cat:hover::after{width:100%}
.cat-mark{font-family:var(--display);font-size:3.6rem;line-height:1;color:transparent;
  -webkit-text-stroke:1px rgba(252,212,160,.38);letter-spacing:-.03em;margin-bottom:20px;transition:.4s var(--ease)}
.cat:hover .cat-mark{color:rgba(252,212,160,.95);-webkit-text-stroke-color:transparent;transform:translateX(2px)}
.cat h4{font-family:var(--display);font-size:1.32rem;font-weight:500;text-transform:none;letter-spacing:0;margin-bottom:10px;color:#fff}
.cat p{font-size:.9rem;line-height:1.65}
.cat-win{margin-top:auto;padding-top:18px;padding-top:16px;border-top:1px solid rgba(252,212,160,.14);color:rgba(252,212,160,.55)}

/* ---- nominee cards ---- */
.grid-nominees{gap:20px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
@media(min-width:1180px){.grid-nominees{grid-template-columns:repeat(4,1fr)}}
@media(min-width:980px) and (max-width:1179px){.grid-nominees{grid-template-columns:repeat(4,1fr)}}
.nominee{border-radius:16px;border:1px solid rgba(252,212,160,.16);background:var(--panel);
  transition:.45s var(--ease);overflow:hidden}
.nominee:hover{transform:translateY(-8px);border-color:rgba(252,212,160,.55);
  box-shadow:0 40px 70px -45px #000,0 0 50px -28px rgba(252,212,160,.4)}
.n-photo{aspect-ratio:4/5;background:linear-gradient(165deg,#0e2634,#071520 70%)}
.n-photo img{filter:saturate(.95) contrast(1.03)}
.n-photo::after{background:linear-gradient(180deg,rgba(4,12,18,.45) 0%,transparent 30%,rgba(9,22,31,.55) 72%,#0a1a24 100%)}
.n-photo::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;transition:.5s;
  background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.1) 50%,transparent 65%)}
.nominee:hover .n-photo::before{opacity:1}
.n-tag{top:14px;right:14px;font-size:8px;letter-spacing:.22em;padding:6px 11px;
  border-color:rgba(252,212,160,.35);background:rgba(6,18,26,.6)}
.n-body{padding:18px 18px 18px;gap:10px;margin-top:-46px}
.n-body h3{font-size:1.08rem;letter-spacing:-.01em}
.n-meta{font-size:11.5px;color:rgba(252,212,160,.55);letter-spacing:.02em}
.n-quote{font-size:1rem;color:rgba(252,212,160,.72);line-height:1.35}
.n-stats{border-top:1px solid rgba(252,212,160,.16);padding-top:14px;margin-top:16px}
.n-stats b{font-size:1.22rem;color:#fcd4a0;font-weight:400}
.n-stats span{font-size:7px;letter-spacing:.2em;color:rgba(252,212,160,.45)}
.n-foot{padding-top:14px;margin-top:2px;border-top:1px solid rgba(252,212,160,.1)}
.nom-label{font-size:7.5px;letter-spacing:.24em;text-transform:uppercase;color:rgba(252,212,160,.4)}
.link-btn{font-size:9px;letter-spacing:.22em;border:0;padding:0;color:#fcd4a0;position:relative}
.link-btn::after{content:"→";display:inline-block;margin-left:7px;transition:transform .3s var(--ease)}
.link-btn:hover{color:#fff}
.link-btn:hover::after{transform:translateX(4px)}

/* portrait placeholder */
.ph-portrait{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;
  background:
    radial-gradient(70% 55% at 50% 34%,rgba(252,212,160,.16),transparent 70%),
    radial-gradient(90% 60% at 50% 108%,rgba(32,84,108,.55),transparent 70%),
    linear-gradient(170deg,#0f2836,#07141d)}
.ph-crest{position:absolute;width:74%;opacity:.1;filter:blur(.3px);transform:translateY(-2%)}
.ph-mono{position:relative;z-index:2;font-family:var(--display);font-style:italic;font-size:4.2rem;
  background:linear-gradient(180deg,rgba(255,244,226,.95),rgba(252,212,160,.45));
  -webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.02em;line-height:1}
.ph-ring{position:absolute;width:56%;aspect-ratio:1;border-radius:50%;border:1px solid rgba(252,212,160,.18);
  box-shadow:0 0 60px rgba(252,212,160,.08) inset}
.ph-mono + .ph-ring{bottom:18%}
.m-photo .ph-mono{font-size:5.4rem}

/* ---- results sealed ---- */
.locked{padding:0;border-radius:20px;border:1px solid rgba(252,212,160,.3);
  background:
    radial-gradient(90% 70% at 50% -10%,rgba(252,212,160,.12),transparent 62%),
    linear-gradient(180deg,#0b1f2b,#081620);
  position:relative;overflow:hidden}
.locked::before,.locked::after{content:"";position:absolute;width:44px;height:44px;pointer-events:none;z-index:2}
.locked::before{left:14px;top:14px;border-left:1px solid rgba(252,212,160,.45);border-top:1px solid rgba(252,212,160,.45)}
.locked::after{right:14px;bottom:14px;border-right:1px solid rgba(252,212,160,.45);border-bottom:1px solid rgba(252,212,160,.45)}
.locked-inner{padding:64px 40px 54px}
.seal{width:74px;height:74px;margin:0 auto 24px;border-radius:50%;display:grid;place-items:center;position:relative;
  border:1px solid rgba(252,212,160,.5);background:radial-gradient(circle at 50% 35%,rgba(252,212,160,.2),rgba(10,26,36,.9));
  box-shadow:0 0 0 8px rgba(252,212,160,.05),0 0 40px rgba(252,212,160,.15)}
.seal::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(252,212,160,.15);
  animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.08);opacity:.25}}
.seal svg{width:30px;height:30px;stroke:#fcd4a0;fill:none;stroke-width:1.3}
.locked h3{font-size:clamp(1.6rem,3.1vw,2.15rem);margin:14px 0 6px;letter-spacing:.005em;padding:0 12px;line-height:1.15;
  background:linear-gradient(180deg,#fff6e8,#fcd4a0 70%);-webkit-background-clip:text;background-clip:text;color:transparent}
.locked .lead{max-width:56ch;font-size:.95rem}
.lock-rows{margin-top:40px;max-width:680px}
.lock-row{padding:18px 0;border-bottom:1px solid rgba(252,212,160,.1);grid-template-columns:46px 1fr 130px}
.lr-pos{font-family:var(--display);font-size:1.05rem;color:rgba(252,212,160,.3)}
.lr-bar{height:7px;border-radius:99px;position:relative;overflow:hidden;border:1px solid rgba(252,212,160,.14);
  background:linear-gradient(90deg,rgba(252,212,160,.3),rgba(252,212,160,.1))}
.lr-bar::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(252,212,160,.35),transparent);animation:shimmer 3.4s ease-in-out infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
.lr-tag{font-size:7.5px;letter-spacing:.26em;color:rgba(252,212,160,.55);white-space:nowrap;text-align:right}

/* ---- trophy band ---- */
.trophy-band{min-height:720px;background:#081620}
.trophy-band::before{content:"";position:absolute;left:0;top:0;bottom:0;width:70%;z-index:1;pointer-events:none;
  background:linear-gradient(90deg,rgba(8,22,31,.96) 0%,rgba(8,22,31,.86) 42%,rgba(8,22,31,.4) 66%,transparent 92%)}
.trophy-copy h2{font-size:clamp(2.6rem,5.2vw,4.4rem);line-height:.92;letter-spacing:-.018em;
  background:linear-gradient(105deg,#fff8ee,#fcd4a0 45%,#dfa968 78%,#fff1dc);
  background-size:170% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:goldShift 14s ease-in-out infinite}
.trophy-copy .lead{font-size:1rem;color:rgba(252,212,160,.72);max-width:42ch}
.trophy-bg::after{background:
  radial-gradient(72% 62% at 58% 45%,transparent 46%,rgba(4,12,18,.55) 100%),
  linear-gradient(90deg,#081620 0%,rgba(8,22,31,.94) 7%,rgba(8,22,31,.55) 20%,transparent 44%),
  linear-gradient(0deg,#081620 0%,rgba(8,22,31,.45) 9%,transparent 28%),
  linear-gradient(180deg,rgba(8,22,31,.6) 0%,transparent 18%)}

/* ---- footer ---- */
footer{padding:72px 0 0;position:relative;overflow:hidden;border-top:1px solid rgba(252,212,160,.14)}
.foot{grid-template-columns:minmax(0,520px) 210px;gap:64px;justify-content:start;margin-bottom:52px}
.foot-word{font-family:var(--display);font-size:clamp(4rem,12.5vw,11rem);line-height:.8;text-align:center;
  letter-spacing:.02em;color:transparent;-webkit-text-stroke:1px rgba(252,212,160,.14);
  margin:26px 0 22px;user-select:none;pointer-events:none;white-space:nowrap}
.foot-bottom{border-top:1px solid rgba(252,212,160,.12);padding:22px 0 26px;margin-top:0}
.foot h4{font-size:1rem;letter-spacing:.16em}
.foot a.f-link:hover{color:#fcd4a0;transform:translateX(2px)}
.foot a.f-link{transition:.2s var(--ease)}

/* ---- reveal ---- */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.reveal.in{opacity:1;transform:none}
.reveal.d1{transition-delay:.08s}.reveal.d2{transition-delay:.16s}.reveal.d3{transition-delay:.24s}

@media(prefers-reduced-motion:reduce){
  .reveal{opacity:1!important;transform:none!important}
  .banner::after,.banner-title,.trophy-copy h2,.lr-bar::after,.seal::after{animation:none!important}
}
@media(max-width:980px){
  .banner-body{padding:26px 24px 32px}
  .banner-title{font-size:clamp(2.6rem,11vw,3.4rem)}
  .hero{padding:104px 0 24px}
  .locked-inner{padding:44px 22px 40px}
  .foot-word{font-size:clamp(3rem,16vw,6rem);margin-bottom:-1vw}
  .nav-inner{height:66px}
}
@media(max-width:700px){
  .fab{display:none}
}
@media(max-width:560px){
  .grid-nominees{grid-template-columns:1fr 1fr;gap:12px}
  .n-quote{display:none}
  .ph-mono{font-size:2.6rem}
  .n-body{padding:12px 12px 14px;margin-top:-34px}
  .cat-mark{font-size:2.4rem}
  .lock-row{grid-template-columns:18px 1fr 66px;gap:10px;padding:14px 0}
  .lr-tag{font-size:6px;letter-spacing:.14em}
  .locked-inner{padding:40px 18px 34px}
  .locked h3{font-size:1.45rem;padding:0 2px;margin-top:12px}
  .seal{width:62px;height:62px;margin-bottom:18px}
  .seal svg{width:25px;height:25px}
  .lock-rows{margin-top:28px}
}


/* mobile nav: two-row header, links pinned inside the header box */
@media(max-width:820px){
  .nav{position:relative;padding-bottom:38px}
  .nav-inner{display:grid;grid-template-columns:1fr auto 1fr;height:64px;padding:0 16px;gap:8px;flex-wrap:nowrap}
  .nav-left{position:absolute;left:0;right:0;bottom:0;height:38px;display:flex;justify-content:center;align-items:center;
    gap:26px;border-top:1px solid rgba(252,212,160,.12)}
  .nav-left a{display:block;font-size:9px;letter-spacing:.18em;padding:0}
  .nav-left a::after{bottom:-4px}
  .nav-logo{height:auto;margin:0 auto}
  .hero{padding-top:146px}
}

/* ---- final match countdown ---- */
.final-band{padding:90px 0 10px}
.final-card{border:1px solid rgba(252,212,160,.35);border-radius:20px;padding:48px 28px 42px;text-align:center;
  background:radial-gradient(80% 130% at 50% -20%,rgba(252,212,160,.14),transparent 62%),linear-gradient(180deg,#0b1f2b,#081620);
  position:relative;overflow:hidden}
.final-card h2{margin:14px 0 30px;font-size:clamp(1.5rem,3vw,2.3rem)}
.final-card.reveal,.final-card{opacity:1!important;transform:none!important;visibility:visible!important}
.count{display:flex;align-items:flex-start;justify-content:center;gap:16px}
.count-unit{min-width:88px}
.count-unit b{display:block;font-family:var(--display);font-size:clamp(2.1rem,5.6vw,3.5rem);line-height:1;color:var(--champagne);font-weight:500;font-variant-numeric:tabular-nums}
.count-unit span{display:block;margin-top:9px;font-size:8px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.count-sep{font-family:var(--display);font-size:clamp(1.5rem,3.6vw,2.4rem);color:rgba(252,212,160,.45);line-height:1.25}
.final-date{margin:28px 0 0;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.final-done{margin:18px 0 0;color:var(--champagne);font-size:12px;letter-spacing:.2em;text-transform:uppercase}
@media(max-width:640px){.count{gap:8px}.count-unit{min-width:62px}.count-sep{display:none}}

/* ================= THE ROAD TIMELINE ================= */
.road-sec{padding:96px 0 100px;position:relative}
.road-sec .sec-head{margin-bottom:54px}
.road-scroll{overflow-x:auto;overflow-y:hidden;padding:6px 34px 30px;cursor:grab;
  scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch}
.road-scroll::-webkit-scrollbar{display:none}
.road-scroll.dragging{cursor:grabbing}
.road-scroll.dragging a,.road-scroll.dragging *{user-select:none}
.road-track{position:relative;display:grid;grid-template-columns:repeat(7,1fr) 318px;
  grid-template-rows:auto 156px auto;min-width:1780px}
.road-line{grid-area:2/1/3/9;align-self:center;height:1px;pointer-events:none;
  background:linear-gradient(90deg,rgba(252,212,160,.10),rgba(252,212,160,.62) 6%,rgba(252,212,160,.62) 95%,rgba(252,212,160,.18));
  box-shadow:0 0 18px rgba(252,212,160,.18)}
.road-copy{grid-row:1;align-self:end;padding:0 34px 0 2px;margin-bottom:10px}
.road-copy.down{grid-row:3;align-self:start;margin-top:10px;margin-bottom:0}
.road-copy h3{margin:0 0 14px;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--champagne);line-height:1.25}
.road-copy p{margin:0;font-size:13.5px;line-height:1.75;color:rgba(252,212,160,.64);font-weight:300;overflow-wrap:break-word}
.road-stem{grid-row:2;align-self:center;justify-self:center;width:1px;height:72px;
  background:linear-gradient(180deg,rgba(252,212,160,.55),rgba(252,212,160,.18))}
.road-stem.up{transform:translateY(-36px);background:linear-gradient(0deg,rgba(252,212,160,.55),rgba(252,212,160,.18))}
.road-stem.down{transform:translateY(36px)}
.road-dot{grid-row:2;align-self:center;justify-self:center;width:10px;height:10px;border-radius:50%;
  background:var(--champagne);box-shadow:0 0 0 5px rgba(252,212,160,.10),0 0 18px rgba(252,212,160,.35)}
.road-box{grid-area:2/8/3/9;align-self:center;position:relative;z-index:2;width:100%;
  border:1px solid rgba(252,212,160,.55);border-radius:16px;
  background:linear-gradient(180deg,#0b1f2b,#081620);padding:30px 26px;
  box-shadow:0 0 40px rgba(252,212,160,.07),inset 0 1px 0 rgba(255,255,255,.04)}
.road-box h3{margin:0 0 14px;font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--champagne);line-height:1.25}
.road-box p{margin:0;font-size:13.5px;line-height:1.75;color:rgba(252,212,160,.68);font-weight:300}
@media(max-width:900px){
  .road-sec{padding:74px 0 76px}
  .road-scroll{padding:6px 22px 26px}
  .road-track{min-width:1660px;grid-template-columns:repeat(7,1fr) 300px;grid-template-rows:auto 138px auto}
  .road-stem{height:64px}
  .road-stem.up{transform:translateY(-32px)}
  .road-stem.down{transform:translateY(32px)}
}

/* ---- results ---- */

.r-wrap{max-width:920px;margin:0 auto;padding:60px 24px 90px}
.r-wrap h1{font-family:var(--display);font-size:clamp(1.8rem,4.4vw,2.8rem);text-transform:uppercase;line-height:1;margin:12px 0 8px}
.r-sub{color:var(--muted);font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.r-cat{margin-top:36px;padding-top:20px;border-top:1px solid rgba(252,212,160,.14)}
.r-cat h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-size:1rem;margin:0 0 14px}
.r-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:9px 0}
.r-name{font-size:13.5px;color:rgba(252,212,160,.9)}
.r-num{font-family:var(--display);font-size:15px;color:var(--champagne)}
.r-bar{grid-column:1/-1;height:3px;border-radius:2px;background:rgba(252,212,160,.14);overflow:hidden;margin-top:-2px}
.r-fill{height:100%;background:linear-gradient(90deg,rgba(252,212,160,.5),var(--champagne))}
.r-gate{max-width:400px;margin:110px auto;text-align:center;padding:0 24px}
.r-gate input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid rgba(252,212,160,.25);
  background:rgba(255,255,255,.02);color:var(--text);font:inherit;text-align:center;letter-spacing:.2em}
.r-gate button{margin-top:14px;width:100%;padding:14px;border-radius:999px;border:1px solid var(--champagne);
  background:var(--champagne);color:#0a1a24;font:inherit;font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="r-gate" id="gate">
  <div class="eyebrow" style="justify-content:center">Private</div>
  <h1 style="font-family:var(--display);text-transform:uppercase;font-size:1.5rem;margin:14px 0 20px">Results</h1>
  <input id="pass" type="password" placeholder="Passcode" autocomplete="off">
  <button id="go">Open results</button>
  <p id="err" style="color:#ff8b7e;font-size:12px;margin-top:12px;min-height:16px"></p>
</div>
<div class="r-wrap" id="out" hidden></div>

<script>
const VOTE = [{"cat": "RC Ballon d'Or", "opts": [{"label": "Deniz", "sub": "Quasaunt FC"}, {"label": "Nawar", "sub": "Dechamps FC"}, {"label": "Mohammad", "sub": "Quasaunt FC"}, {"label": "Taylan", "sub": "Dechamps FC"}, {"label": "Rivansh", "sub": "Dechamps FC"}]}, {"cat": "Puskás Award", "opts": [{"label": "Nawar", "sub": "Dechamps FC"}, {"label": "Deniz", "sub": "Quasaunt FC"}, {"label": "Taylan", "sub": "Dechamps FC"}]}, {"cat": "Most Improved · Rising Star", "opts": [{"label": "Timmy", "sub": "Dechamps FC"}, {"label": "Alex", "sub": "Dechamps FC"}, {"label": "Aryan", "sub": "Quasaunt FC"}]}, {"cat": "The Corinthian Award", "opts": [{"label": "Mohammad", "sub": "Quasaunt FC"}, {"label": "Deniz", "sub": "Quasaunt FC"}, {"label": "Alex", "sub": "Dechamps FC"}]}, {"cat": "Club of the Year", "opts": [{"label": "Quasaunt FC", "sub": "Club"}, {"label": "Dechamps FC", "sub": "Club"}]}];
const ENDPOINT = "https://script.google.com/macros/s/AKfycbxYil3gMut6ZGi1Sr9Uj-bXp7iWdv3dlBDQRbG5N_YAcJDG_Lo8rWOyErzl5m0hUtgv/exec";
const KEY = "rcbdo2026-live";

document.getElementById("go").addEventListener("click", load);
document.getElementById("pass").addEventListener("keydown", function (e) { if (e.key === "Enter") load(); });

function load() {
  const pass = document.getElementById("pass").value.trim();
  if (pass !== KEY) { document.getElementById("err").textContent = "Wrong passcode."; return; }
  document.getElementById("gate").hidden = true;
  const out = document.getElementById("out");
  out.hidden = false;
  out.innerHTML = '<h1>Live results</h1><p class="r-sub">Loading…</p>';
  fetch(ENDPOINT + "?key=" + encodeURIComponent(KEY) + "&t=" + Date.now())
    .then(function (r) { return r.json(); })
    .then(render)
    .catch(function (e) { out.innerHTML = '<h1>Live results</h1><p class="r-sub">Could not read the vote sheet.</p>'; });
}

function render(d) {
  const out = document.getElementById("out");
  if (!d || !d.ok) { out.innerHTML = '<h1>Live results</h1><p class="r-sub">Blocked: ' + JSON.stringify(d) + '</p>'; return; }
  const tally = d.tally || {};
  let html = '<h1>Live results</h1><p class="r-sub">' + d.ballots + ' vote rows counted</p>';
  VOTE.forEach(function (c) {
    const t = tally[c.cat] || {};
    const opts = c.opts.map(function (o) { return [o.label, t[o.label] || 0]; }).sort(function (a, b) { return b[1] - a[1]; });
    const max = Math.max(1, opts.length ? opts[0][1] : 1);
    html += '<div class="r-cat"><h3>' + c.cat + '</h3>';
    opts.forEach(function (r, i) {
      html += '<div class="r-row"><span class="r-name">' + (i === 0 && r[1] > 0 ? '★ ' : '') + r[0] + '</span><span class="r-num">' + r[1] + '</span>' +
        '<div class="r-bar"><div class="r-fill" style="width:' + Math.round(r[1] / max * 100) + '%"></div></div></div>';
    });
    html += '</div>';
  });
  out.innerHTML = html;
}
</script>
</body>
</html>
